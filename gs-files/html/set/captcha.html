<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>🧩 GS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: radial-gradient(ellipse at top, #101915 0%, #0c110e 50%); color: #e2e8f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; }
    .card { background: #131a16; border: 1px solid #1e2a22; border-radius: 16px; padding: 28px; width: 100%; max-width: 380px; text-align: center; animation: cardEnter 0.4s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
    @keyframes cardEnter { from { opacity: 0; transform: translateY(20px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .top-bar { display: flex; justify-content: flex-end; margin-bottom: 12px; }
    .lang-btn { background: #0c110e; border: 1px solid #233228; color: #94a3b8; padding: 4px 8px; border-radius: 6px; font-size: 11px; outline: none; cursor: pointer; }
    .icon { width: 48px; height: 48px; background: #17261e; color: #10b981; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: 14px; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    h1 { font-size: 17px; margin-bottom: 6px; }
    p { font-size: 13px; color: #94a3b8; margin-bottom: 16px; }
    .captcha-wrap { position: relative; margin-bottom: 14px; display: flex; gap: 8px; align-items: center; justify-content: center; }
    .captcha-canvas { background: linear-gradient(135deg, #0c110e 0%, #131a16 100%); border: 1px solid #233228; border-radius: 10px; cursor: pointer; transition: all 0.2s ease; user-select: none; }
    .captcha-canvas:hover { border-color: #10b981; }
    .captcha-canvas:active { transform: scale(0.98); }
    .refresh-btn { background: #1b2620; border: 1px solid #27382d; color: #10b981; width: 44px; height: 44px; border-radius: 10px; font-size: 18px; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; }
    .refresh-btn:hover { border-color: #10b981; transform: rotate(180deg); }
    .refresh-btn:active { transform: rotate(180deg) scale(0.9); }
    input { width: 100%; padding: 12px 14px; background: #0c110e; border: 1px solid #233228; border-radius: 10px; color: #fff; font-size: 16px; letter-spacing: 4px; text-align: center; text-transform: uppercase; font-weight: 700; margin-bottom: 12px; outline: none; transition: border-color 0.2s ease; }
    input:focus { border-color: #10b981; box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1); }
    button.submit { width: 100%; background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: #062419; border: none; padding: 12px; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 2px 8px rgba(16, 185, 129, 0.2); }
    button.submit:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4); }
    button.submit:active { transform: translateY(0); }
    .err { color: #ef4444; font-size: 12px; margin-bottom: 12px; padding: 6px 10px; background: rgba(239, 68, 68, 0.1); border-radius: 6px; border-left: 3px solid #ef4444; animation: shake 0.4s ease; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="top-bar">
      <select class="lang-btn" onchange="setLang(this.value)">
        <option value="es_es">Español</option>
        <option value="en_us">English (US)</option>
        <option value="ru_ru">Русский</option>
        <option value="zh_cn">简体中文 (CN)</option>
        <option value="zh_tw">繁體中文 (TW)</option>
      </select>
    </div>
    <div class="icon">🧩</div>
    <h1 id="t_title" data-i18n="captcha_title">Verificación de seguridad</h1>
    <p id="t_desc" data-i18n="captcha_desc">Escribe el código que ves en la imagen</p>
    <div id="t_err" class="err" style="display:none;"></div>
    <div class="captcha-wrap">
      <canvas id="captchaCanvas" class="captcha-canvas" width="180" height="60" onclick="refreshCaptcha()"></canvas>
      <button class="refresh-btn" onclick="refreshCaptcha()" title="Refresh">↻</button>
    </div>
    <form id="captchaForm" method="POST">
      <input type="hidden" id="challengeId" name="captcha_id">
      <input type="text" id="captchaAnswer" name="captcha_answer" maxlength="6" placeholder="·····" autocomplete="off" autocapitalize="characters" spellcheck="false" required>
      <button type="submit" class="submit" data-i18n="captcha_btn">Verificar</button>
    </form>
  </div>

  <script>
    var SLUG = '{{slug}}';
    var DOMAIN = '{{domain}}';
    var ADMIN_ORIGIN = '{{admin_origin}}';
    var HAS_ERROR = "{{hasError}}" === "true";
    var currentText = '';
    var currentChallengeId = '';

    async function loadLocale(lang) {
      try {
        var res = await fetch(ADMIN_ORIGIN + '/gs-files/locales/' + lang + '.json?v=' + Date.now());
        if (!res.ok) {
          var fallback = await fetch(ADMIN_ORIGIN + '/gs-files/locales/es_es.json?v=' + Date.now());
          return await fallback.json();
        }
        return await res.json();
      } catch {
        var fallback = await fetch(ADMIN_ORIGIN + '/gs-files/locales/es_es.json?v=' + Date.now());
        return await fallback.json();
      }
    }

    async function setLang(lang) {
      localStorage.setItem('gs_lang', lang);
      document.querySelector('.lang-btn').value = lang;
      var t = await loadLocale(lang);
      document.getElementById('t_title').textContent = t.captcha_title || 'Verificación de seguridad';
      document.getElementById('t_desc').textContent = t.captcha_desc || 'Escribe el código';
      document.getElementById('captchaAnswer').placeholder = t.captcha_placeholder || '·····';
      document.querySelector('button.submit').textContent = t.captcha_btn || 'Verificar';
      var errEl = document.getElementById('t_err');
      if (errEl) errEl.textContent = t.captcha_error || 'Código incorrecto';
    }

    async function refreshCaptcha() {
      try {
        var res = await fetch(ADMIN_ORIGIN + '/api/captcha-challenge?slug=' + encodeURIComponent(SLUG) + '&domain=' + encodeURIComponent(DOMAIN) + '&_=' + Date.now());
        var data = await res.json();
        if (!res.ok) {
          document.getElementById('t_err').textContent = data.error || 'Error';
          document.getElementById('t_err').style.display = 'block';
          return;
        }
        currentChallengeId = data.challengeId;
        document.getElementById('challengeId').value = currentChallengeId;

        var payload = atob(currentChallengeId.split('.')[1]);
        var parts = payload.split('|');
        currentText = parts[2] || '';

        drawCaptcha(currentText);
        document.getElementById('captchaAnswer').value = '';
        document.getElementById('captchaAnswer').focus();
      } catch (e) {
        document.getElementById('t_err').textContent = 'Error';
        document.getElementById('t_err').style.display = 'block';
      }
    }

    function drawCaptcha(text) {
      var canvas = document.getElementById('captchaCanvas');
      var ctx = canvas.getContext('2d');
      var w = canvas.width;
      var h = canvas.height;

      var grad = ctx.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, '#0c110e');
      grad.addColorStop(1, '#131a16');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      for (var i = 0; i < 60; i++) {
        ctx.fillStyle = 'rgba(16, 185, 129, ' + (0.1 + Math.random() * 0.3) + ')';
        ctx.beginPath();
        ctx.arc(Math.random() * w, Math.random() * h, Math.random() * 1.8, 0, Math.PI * 2);
        ctx.fill();
      }

      for (var i = 0; i < 3; i++) {
        ctx.strokeStyle = 'rgba(16, 185, 129, ' + (0.15 + Math.random() * 0.2) + ')';
        ctx.lineWidth = 1 + Math.random() * 1.5;
        ctx.beginPath();
        ctx.moveTo(Math.random() * w, Math.random() * h);
        ctx.bezierCurveTo(
          Math.random() * w, Math.random() * h,
          Math.random() * w, Math.random() * h,
          Math.random() * w, Math.random() * h
        );
        ctx.stroke();
      }

      var charWidth = w / (text.length + 1);
      for (var i = 0; i < text.length; i++) {
        ctx.save();
        var x = charWidth * (i + 0.8) + (Math.random() - 0.5) * 6;
        var y = h / 2 + (Math.random() - 0.5) * 10;
        var angle = (Math.random() - 0.5) * 0.5;
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.font = 'bold ' + (26 + Math.random() * 8) + 'px "SF Mono", Menlo, monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = 'hsl(' + (150 + Math.random() * 30) + ', 70%, ' + (55 + Math.random() * 15) + '%)';
        ctx.fillText(text[i], 0, 0);
        ctx.restore();
      }
    }

    document.getElementById('captchaForm').addEventListener('submit', function(e) {
      // POST a la misma URL con challengeId + captcha_answer
    });

    var saved = localStorage.getItem('gs_lang') || 'es_es';
    setLang(saved);
    if (HAS_ERROR) {
      document.getElementById('t_err').textContent = 'Código incorrecto';
      document.getElementById('t_err').style.display = 'block';
    }
    refreshCaptcha();
  </script>
</body>
</html>
