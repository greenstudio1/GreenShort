<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>🔒 GS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #0c110e; color: #e2e8f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; }
    .card { background: #131a16; border: 1px solid #1e2a22; border-radius: 14px; padding: 24px; width: 100%; max-width: 360px; text-align: center; }
    .top-bar { display: flex; justify-content: flex-end; margin-bottom: 12px; }
    .lang-btn { background: #0c110e; border: 1px solid #233228; color: #94a3b8; padding: 4px 8px; border-radius: 6px; font-size: 11px; outline: none; }
    .icon { width: 44px; height: 44px; background: #17261e; color: #10b981; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 20px; margin-bottom: 12px; }
    h1 { font-size: 17px; margin-bottom: 6px; }
    p { font-size: 13px; color: #94a3b8; margin-bottom: 16px; }
    .pwd-wrap { position: relative; display: flex; align-items: center; margin-bottom: 12px; }
    input { width: 100%; padding: 11px 14px; background: #0c110e; border: 1px solid #233228; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
    .pwd-wrap input { padding-right: 44px; }
    input:focus { border-color: #10b981; }
    .pwd-toggle { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #94a3b8; padding: 6px; cursor: pointer; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; line-height: 0; }
    .pwd-toggle:hover { color: #10b981; background: rgba(16,185,129,0.08); }
    .pwd-toggle svg { width: 18px; height: 18px; display: block; }
    button.submit { width: 100%; background: #10b981; color: #062419; border: none; padding: 11px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; }
    button.submit:active { background: #059669; }
    .err { color: #ef4444; font-size: 12px; margin-bottom: 12px; padding: 6px 10px; background: rgba(239, 68, 68, 0.1); border-radius: 6px; border-left: 3px solid #ef4444; display: none; }
    .err.show { display: block; animation: shake 0.4s ease; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="top-bar">
      <select class="lang-btn" onchange="setLang(this.value)">
        <option value="es_es">Español</option>
        <option value="en_us">English (US)</option>
        <option value="ru_ru">Русский</option>
        <option value="zh_cn">简体中文 (CN)</option>
        <option value="zh_tw">繁體中文 (TW)</option>
      </select>
    </div>
    <div class="icon">🔒</div>
    <h1 id="t_title">Enlace Protegido</h1>
    <p id="t_desc">Ingresa la contraseña para acceder a /{{slug}}</p>
    <div id="t_err" class="err"></div>
    <form method="POST">
      <div class="pwd-wrap">
        <input type="text" id="t_input" name="password" placeholder="Contraseña..." required autofocus autocomplete="off" spellcheck="false">
        <button type="button" class="pwd-toggle" id="t_toggle" tabindex="-1" aria-label="Toggle password visibility">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <button type="submit" id="t_btn" class="submit">Desbloquear</button>
    </form>
  </div>
  <script>
    var HAS_ERROR = "{{hasError}}" === "true";

    var EYE_OPEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
    var EYE_CLOSED = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

    function togglePwd() {
      var input = document.getElementById('t_input');
      var btn = document.getElementById('t_toggle');
      var hidden = input.dataset.hidden === '1';
      if (hidden) {
        input.dataset.hidden = '0';
        input.style.webkitTextSecurity = 'none';
        btn.innerHTML = EYE_CLOSED;
      } else {
        input.dataset.hidden = '1';
        input.style.webkitTextSecurity = 'disc';
        btn.innerHTML = EYE_OPEN;
      }
    }

    async function loadLocale(lang) {
      try {
        var res = await fetch('/gs-files/locales/' + lang + '.json');
        if (!res.ok) {
          var fallback = await fetch('/gs-files/locales/es_es.json');
          return await fallback.json();
        }
        return await res.json();
      } catch {
        var fallback = await fetch('/gs-files/locales/es_es.json');
        return await fallback.json();
      }
    }

    async function setLang(lang) {
      localStorage.setItem('gs_lang', lang);
      document.querySelector('.lang-btn').value = lang;
      var t = await loadLocale(lang);
      var slug = '{{slug}}';
      document.getElementById('t_title').textContent = t.pwd_title || "Enlace Protegido";
      document.getElementById('t_desc').textContent = t.pwd_desc ? t.pwd_desc.replace('%s', slug) : 'Ingresa la contraseña para acceder a /' + slug;
      document.getElementById('t_input').placeholder = t.pwd_input || "Contraseña...";
      document.getElementById('t_btn').textContent = t.pwd_btn || "Desbloquear";
      document.getElementById('t_err').textContent = t.pwd_error || "Contraseña incorrecta";
    }

    document.getElementById('t_toggle').addEventListener('click', togglePwd);

    var input = document.getElementById('t_input');
    input.dataset.hidden = '1';
    input.style.webkitTextSecurity = 'disc';

    var saved = localStorage.getItem('gs_lang') || 'es_es';
    setLang(saved);

    if (HAS_ERROR) {
      var errEl = document.getElementById('t_err');
      errEl.textContent = 'Contraseña incorrecta';
      errEl.classList.add('show');
    }
  </script>
</body>
</html>
